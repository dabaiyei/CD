name: cineforge

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cineforge}
      POSTGRES_USER: ${POSTGRES_USER:-cineforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cineforge-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  object-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-cineforge}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-cineforge-local-object-secret}
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent-runtime:
    build:
      context: ${CINEFORGE_SOURCE_ROOT:-.}/services/agent-runtime/agentscope
    restart: unless-stopped
    environment:
      AGENT_RUNTIME_INTERNAL_TOKEN: ${AGENT_RUNTIME_INTERNAL_TOKEN:-cineforge-local-runtime-token}
      AGENT_RUNTIME_DATA_ROOT: /var/lib/cineforge-agent-runtime
      AGENT_RUNTIME_MAX_CONCURRENT_RUNS: ${AGENT_RUNTIME_MAX_CONCURRENT_RUNS:-2}
      AGENT_RUNTIME_MAX_REACT_ITERATIONS: ${AGENT_RUNTIME_MAX_REACT_ITERATIONS:-30}
      AGENT_RUNTIME_MODEL_CONTEXT_SIZE: ${AGENT_RUNTIME_MODEL_CONTEXT_SIZE:-128000}
    expose:
      - "8010"
    volumes:
      - agent_runtime_data:/var/lib/cineforge-agent-runtime
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 10

  api:
    build:
      context: ${CINEFORGE_SOURCE_ROOT:-.}/apps/api
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cineforge}:${POSTGRES_PASSWORD:-cineforge-local-password}@postgres:5432/${POSTGRES_DB:-cineforge}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-cineforge-local-jwt-secret-change-me}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-30}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-300}
      CREDENTIAL_ENCRYPTION_SECRET: ${CREDENTIAL_ENCRYPTION_SECRET:-cineforge-local-credential-secret}
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-8080}"]'
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SKILLS_ROOT: /var/lib/cineforge/skills
      UPLOADS_ROOT: /var/lib/cineforge/uploads
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://object-storage:9000
      S3_BUCKET: ${S3_BUCKET:-cineforge}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-cineforge}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-cineforge-local-object-secret}
      S3_AUTO_CREATE_BUCKET: "true"
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-cineforge-local-media-signing-secret}
      REQUIRE_SIGNED_MEDIA_URLS: "true"
      AGENT_RUNTIME_URL: http://agent-runtime:8010
      AGENT_RUNTIME_INTERNAL_TOKEN: ${AGENT_RUNTIME_INTERNAL_TOKEN:-cineforge-local-runtime-token}
    expose:
      - "8000"
    volumes:
      - uploads_data:/var/lib/cineforge/uploads
      - skills_data:/var/lib/cineforge/skills
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 10

  worker:
    build:
      context: ${CINEFORGE_SOURCE_ROOT:-.}/apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cineforge}:${POSTGRES_PASSWORD:-cineforge-local-password}@postgres:5432/${POSTGRES_DB:-cineforge}
      REDIS_URL: redis://redis:6379/0
      CREDENTIAL_ENCRYPTION_SECRET: ${CREDENTIAL_ENCRYPTION_SECRET:-cineforge-local-credential-secret}
      SEED_DEMO_DATA: "false"
      SKILLS_ROOT: /var/lib/cineforge/skills
      UPLOADS_ROOT: /var/lib/cineforge/uploads
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://object-storage:9000
      S3_BUCKET: ${S3_BUCKET:-cineforge}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-cineforge}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-cineforge-local-object-secret}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-cineforge-local-media-signing-secret}
      REQUIRE_SIGNED_MEDIA_URLS: "true"
      AGENT_RUNTIME_URL: http://agent-runtime:8010
      AGENT_RUNTIME_INTERNAL_TOKEN: ${AGENT_RUNTIME_INTERNAL_TOKEN:-cineforge-local-runtime-token}
      TASK_RECOVERY_INTERVAL_SECONDS: ${TASK_RECOVERY_INTERVAL_SECONDS:-15}
      TASK_LEASE_TIMEOUT_SECONDS: ${TASK_LEASE_TIMEOUT_SECONDS:-90}
      TASK_HEARTBEAT_SECONDS: ${TASK_HEARTBEAT_SECONDS:-20}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      AGENT_CHAT_TASK_TIMEOUT_SECONDS: ${AGENT_CHAT_TASK_TIMEOUT_SECONDS:-300}
    volumes:
      - uploads_data:/var/lib/cineforge/uploads
      - skills_data:/var/lib/cineforge/skills
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  web:
    build:
      context: ${CINEFORGE_SOURCE_ROOT:-.}
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: ${CINEFORGE_NETWORK_SUBNET:-10.253.0.0/24}

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  skills_data:
  agent_runtime_data:
  object_storage_data:
